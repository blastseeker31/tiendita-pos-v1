<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Tiendita POS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ PIN LOGIN SCREEN ═══ -->
<div id="pin-screen"></div>

<!-- ═══ MAIN APPLICATION ═══ -->
<div id="app-main">

<div class="topbar">
  <div class="logo">Tienda de Don Fran</div>
  <div class="clock-wrap">
    <div class="clock-greet" id="clock-greet">Buenos días</div>
    <div class="clock" id="clock-hn">--:-- <span class="clock-ampm" id="clock-ampm">--</span></div>
  </div>
  <div class="alerts">
    <span class="badge badge-green" id="q-stats" style="font-size:0.7rem">Hoy: L0.00</span>
    <span class="tag tag-warn" id="alert-low" style="display:none"><span id="alert-low-count">0</span> stock bajo</span>
    <span class="tag tag-ok" id="alert-loans" style="display:none"><span id="alert-loans-count">0</span> fiados: <span id="alert-loans-amount"></span></span>
    <span class="user-badge" id="user-badge" style="display:none">
      <span id="user-badge-name"></span>
      <button class="lock-btn" onclick="lockScreen()" title="Bloquear sesión">&#x1f512;</button>
    </span>
  </div>
</div>

<div style="display:flex;align-items:stretch;flex-shrink:0">
  <nav id="main-nav" style="flex:1"></nav>
  <div class="theme-toggle" onclick="toggleTheme()" title="Cambiar modo">
    <div class="tt-track"><div class="tt-knob"></div></div>
    <span class="tt-label">Claro</span>
  </div>
</div>

<main>

  <!-- Panel Venta -->
  <div class="panel active" id="panel-venta">
    <div class="pos-split">
      <div class="catalog">
        <div class="catalog-search" style="display:flex;gap:6px">
          <input type="search" id="venta-search" placeholder="Buscar producto..." oninput="renderCatalogGrid()">
          <button class="btn btn-sm btn-ghost" onclick="cart=[];enteredStr='';renderCart()" style="flex-shrink:0;font-size:1.1rem" title="Limpiar carrito (Esc)">&times;</button>
        </div>
        <div class="catalog-grid" id="venta-grid"></div>
      </div>
      <div class="cart-side" id="cart-side"></div>
    </div>
  </div>

  <!-- Panel Catálogo -->
  <div class="panel" id="panel-catalogo"></div>

  <!-- Panel Inventario -->
  <div class="panel" id="panel-inventario"></div>

  <!-- Panel Caja -->
  <div class="panel" id="panel-caja"></div>

  <!-- Panel Préstamos -->
  <div class="panel" id="panel-prestamos"></div>

  <!-- Panel Reportes -->
  <div class="panel" id="panel-reportes"></div>

</main>

<!-- ═══ MODALS ═══ -->

<!-- Receipt Modal -->
<div class="modal-overlay" id="modal-receipt">
  <div class="modal-box">
    <h3>Última Venta</h3>
    <div class="receipt" id="receipt-content"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-receipt')">Cerrar</button>
      <button class="btn btn-primary" onclick="printReceipt()">Imprimir</button>
    </div>
  </div>
</div>

<!-- Product Modal -->
<div class="modal-overlay" id="modal-product">
  <div class="modal-box">
    <h3 id="modal-title">Producto</h3>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <input id="mf-emoji" placeholder="Ícono" maxlength="4" style="width:60px;text-align:center;font-size:1.5rem;flex-shrink:0">
      <input id="mf-name" placeholder="Nombre del producto" style="flex:1" oninput="suggestEmoji(this.value)">
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <input id="mf-cost" placeholder="Costo (L)" type="number" step="0.01" style="width:45%">
      <input id="mf-price" placeholder="Precio (L)" type="number" step="0.01" style="width:45%">
    </div>
    <input id="mf-stock" placeholder="Stock" type="number" style="margin-bottom:10px">
    <input id="mf-category" placeholder="Categoría" style="margin-bottom:10px">
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-product')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProduct()">Guardar</button>
    </div>
  </div>
</div>

<!-- Customer Modal -->
<div class="modal-overlay" id="modal-customer">
  <div class="modal-box">
    <h3 id="cust-modal-title">Nuevo Cliente</h3>
    <input id="cust-name" placeholder="Nombre del cliente">
    <input id="cust-phone" placeholder="Teléfono (opcional)">
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-customer')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCustomer()">Guardar</button>
    </div>
  </div>
</div>

<!-- Transaction Modal -->
<div class="modal-overlay" id="modal-txn">
  <div class="modal-box">
    <h3 id="txn-title">Transacción</h3>
    <input id="txn-amount" placeholder="Monto (L)" type="number" step="0.01">
    <input id="txn-desc" placeholder="Descripción">
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-txn')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveTransaction()">Registrar</button>
    </div>
  </div>
</div>

<!-- Cash Modal -->
<div class="modal-overlay" id="modal-cash">
  <div class="modal-box">
    <h3 id="cash-modal-title">Movimiento de Caja</h3>
    <input id="cash-amount" placeholder="Monto (L)" type="number" step="0.01">
    <input id="cash-desc" placeholder="Descripción">
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-cash')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveCash()">Registrar</button>
    </div>
  </div>
</div>

</div><!-- /#app-main -->

<script src="app.js"></script>
</body>
</html>
